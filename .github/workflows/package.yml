name: 'Create Release'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    env:
      ADDON_MANIFEST_FILEPATH: "${{ github.workspace }}/HonestWrits.txt"

    steps:
      - id: checkout
        name: 'Checkout'
        uses: 'actions/checkout@v4'

      - id: verify-source
        name: 'Verify source'
        run: |
          if ! buildVersion="$( perl -ne 'if (/^## Version:\s+v?([0-9]+(?:\.[0-9]+)*)\s*$/) { print $1; } else { exit(1); };' -- "$ADDON_MANIFEST_FILEPATH"; )";
          then
              printf -- $'Failed to find the addon version in manifest: \'%s\'.\n' "$ADDON_MANIFEST_FILEPATH";

              exit 1;
          fi

          tagName="${{ github.ref_name }}";

          if [[ "v${buildVersion}" != "$tagName" ]];
          then
            printf $'Addon source version \'%s\' mismatches the release tag: \'%s\'.\n' \
              "$buildVersion" "$tagName";

            exit 1;
          fi

      - id: build
        name: 'Build'
        run: |
          mkdir -- '/opt/build';
          cd -- '/opt/build/';

          bash -- "${GITHUB_WORKSPACE}/.project/scripts/pack.sh" "${GITHUB_WORKSPACE}/HonestWrits.txt";

          ls -la;

          printf 'build_filepath=%s\n' "$( readlink -e -- ./*.zip | head -n 1; )" >> "$GITHUB_OUTPUT";

      - id: verify-build
        name: 'Verify build'
        run: |
          addonFilepath="${{ steps.build.outputs.build_filepath }}";
          addonFilename="$( basename -- "$addonFilepath" '.zip'; )";
          buildVersion="v${addonFilename##*v}";
          tagName="${{ github.ref_name }}";

          if [[ "$buildVersion" != "$tagName" ]];
          then
            printf $'Addon build version \'%s\' mismatches the release tag: \'%s\'.\n' \
              "$buildVersion" "$tagName";

            exit 1;
          fi

      - id: prepare-release
        name: 'Prepare release'
        run: |
          mkdir -- '/opt/release';
          mv -- "${{ steps.build.outputs.build_filepath }}" '/opt/release/';

      - id: publish
        name: 'Publish'
        uses: 'softprops/action-gh-release@v2'
        with:
          name: "Honest Writs ${{ github.ref_name }}"
          files: '/opt/release/*'